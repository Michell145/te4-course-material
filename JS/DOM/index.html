<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter template</title>
  </head>
  <body>
    <h2 class="subheading">Subheading 1</h2>
    <h2 class="subheading">Subheading 2</h2>
    <h2 class="subheading">Subheading 3</h2>
    <h1 id="main-title">Welcome to the starter template</h1>
    <p class="message">
      This is basic HTML template to get you started with web development.
    </p>

    <ul>
      <li class="list-item">1</li>
      <li class="list-item">2</li>
      <li class="list-item">3</li>
      <li class="list-item">4</li>
      <li class="list-item">5</li>
    </ul>

    <input type="text" id="input" placeholder="Enter your name" />
    <p id="log"></p>
    <p id="butt"></p>

    <form id="myForm">
      <input class="input" name="name" type="text" placeholder="First Name" />
      <input class="input" name="message" type="text" placeholder="Last Name" />
      <input type="submit" value="Submit" />
    </form>
    <p id="stat"></p>

    <div id="progress-bar"></div>
    <div style="height: 2000px">Scroll down...</div>
    <p id="size"></p>
    <script src="script.js"></script>
  </body>
</html>
